name: fotmob
description: A complete, strongly-typed Dart package that gives you access to real-time football (soccer) data, live scores, match details, transfers, and news from all major leagues. Built on CubePod.
version: 0.1.0
publish_to: none

environment:
  sdk: '>=3.8.0 <4.0.0'

dependencies:
  cubepod_core: ^0.1.5
  cubepod_network: ^0.1.5
  cubepod_query: ^0.1.5
  cubepod_state: ^0.1.5
  http: ^1.2.0
  json_annotation: ^4.12.0

dependency_overrides:
  cubepod_core:
    path: /home/bishwaxyz/cubepod/packages/cubepod_core
  cubepod_network:
    path: /home/bishwaxyz/cubepod/packages/cubepod_network
  cubepod_query:
    path: /home/bishwaxyz/cubepod/packages/cubepod_query
  cubepod_state:
    path: /home/bishwaxyz/cubepod/packages/cubepod_state

dev_dependencies:
  build_runner: ^2.16.0
  json_serializable: ^6.14.1
  test: ^1.24.0

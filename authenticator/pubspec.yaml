name: vault_x
description: "The world's most beautiful Authenticator & Digital Identity Manager."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management & DI
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^14.0.0
  
  # Local Storage & Encryption
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  flutter_secure_storage: ^9.0.0
  
  # Authentication
  google_sign_in: ^6.2.1
  
  # UI & Theming
  google_fonts: ^6.2.1
  lottie: ^3.1.0
  flutter_animate: ^4.5.0
  cached_network_image: ^3.3.1
  responsive_framework: ^1.2.0
  
  # Utilities
  json_annotation: ^4.8.1
  freezed_annotation: ^2.4.1
  uuid: ^4.3.3
  otp: ^3.1.2
  mobile_scanner: ^3.5.6
  encrypt: ^5.0.3
  dio: ^5.4.1
  crypto: ^3.0.3
  
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
  build_runner: ^2.3.3
  freezed: ^2.3.2
  json_serializable: ^6.8.0
  hive_generator: ^2.0.1

flutter:
  uses-material-design: true
